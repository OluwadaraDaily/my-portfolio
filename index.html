<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oluwadara Oloye | Portfolio</title>
    <meta name="description" content="Oluwadara Oloye, software engineer based in Nigeria. Projects, code, and contact details.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oluwadara-oloye.netlify.app/">
    <meta property="og:title" content="Oluwadara Oloye | Portfolio">
    <meta property="og:description" content="Oluwadara Oloye, software engineer based in Nigeria. Projects, code, and contact details.">
    <meta property="og:image" content="https://oluwadara-oloye.netlify.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Self-hosted Space Grotesk (latin subset from Google Fonts) so no third-party CSS blocks rendering. -->
    <link rel="preload" href="/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; font-display: swap; src: url(/fonts/space-grotesk-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; font-display: swap; src: url(/fonts/space-grotesk-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 600; font-display: swap; src: url(/fonts/space-grotesk-600.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; font-display: swap; src: url(/fonts/space-grotesk-700.woff2) format('woff2'); }
    </style>
  </head>
  <body>
    <!-- Netlify Forms detects this at deploy time; the Vue form in Contact.vue posts to it. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name">
      <input type="email" name="email">
      <textarea name="message"></textarea>
      <input name="bot-field">
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
